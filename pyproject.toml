[project]
name = "witness-agent"
version = "0.0.1"
description = "Demand-scanning, judged-change agent for a lending vault on Robinhood Chain (4663)"
requires-python = ">=3.11"
dependencies = [
  "web3>=6.15",
  "httpx>=0.27",
  "pyyaml>=6",
  "pydantic>=2",
  "python-dotenv>=1",
  "anthropic>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agent*"]
